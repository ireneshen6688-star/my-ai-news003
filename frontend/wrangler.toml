name = "my-ai-news003"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "my-ai-news-db"
database_id = "30bac4c4-4f8e-4cd2-9186-9150f11bd8e3"

# ── Cron Triggers ─────────────────────────────────────────────────────────────
# NOTE: Cloudflare Pages does NOT support [triggers] in wrangler.toml.
# Cron must be configured manually in the Cloudflare Dashboard:
#   Pages → my-ai-news003 → Settings → Functions → Cron Triggers
#   Add: */15 * * * *  (every 15 minutes)
# The cron will POST to /api/cron/digest automatically.
