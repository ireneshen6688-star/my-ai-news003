name = "my-ai-news003"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "my-ai-news-db"
database_id = "30bac4c4-4f8e-4cd2-9186-9150f11bd8e3"

# ── Cron Triggers ─────────────────────────────────────────────────────────────
# Cloudflare runs these on UTC schedule and POSTs to /api/cron/digest.
#
# Strategy: run every 15 minutes so we can catch subscriptions scheduled at
# any hour:minute combination without needing per-subscription cron jobs.
# The handler itself filters by next_run_at <= now, so running frequently
# is cheap (most calls return "no subscriptions due" immediately).
#
# Cron syntax: minute hour day-of-month month day-of-week
# */15 * * * *  = every 15 minutes, 24/7

[triggers]
crons = ["*/15 * * * *"]
